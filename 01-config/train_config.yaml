train:
  model: yolo11n.pt
  data: 01-config/dataset.yaml
  epochs: 15
  patience: 30
  batch: 16
  imgsz: 640
  device: 0
  workers: 8
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  degrees: 5.0
  translate: 0.1
  scale: 0.6
  shear: 2.0
  perspective: 0.0005
  fliplr: 0.5
  flipud: 0.0
  mosaic: 0.8
  mixup: 0.1
  copy_paste: 0.0
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  project: vehicles_detection
  name: yolo11n_run
  exist_ok: false
  save_period: 10
  plots: true
  val: true
  verbose: true

mlflow:
  tracking_uri: mlruns
  experiment_name: license-plate-detection
  run_name: yolo11n_run
  name_registry: vehicle_detection
  tags:
    model: yolo11n.pt
    dataset: placas-colombia-v1
    framework: ultralytics
    augmentation: albumentations-severe
